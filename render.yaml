services:
  # InterviewAI Backend Web Service
  - type: web
    name: interview-ai-server
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set via Render dashboard to your MongoDB Atlas cluster URI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: GEMINI_API_KEY
        sync: false # Set via Render dashboard to your Google Gemini API key
      - key: CLIENT_URL
        sync: false # Set to your deployed Vercel frontend URL
